name: Experiment 001

on:
  push:
    paths:
      - "experiments/001-agent-state-integrity/**"
      - ".github/workflows/experiment-001.yml"
  pull_request:
    paths:
      - "experiments/001-agent-state-integrity/**"
      - ".github/workflows/experiment-001.yml"

permissions:
  contents: read

jobs:
  mechanism-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mechanism check
        working-directory: experiments/001-agent-state-integrity
        run: python run.py
      - name: Run adversarial tests
        working-directory: experiments/001-agent-state-integrity
        run: python -m unittest -v
